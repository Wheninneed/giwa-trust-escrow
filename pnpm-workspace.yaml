packages:
  - "apps/*"
  - "packages/*"
# 설치 스크립트 실행을 허용할 패키지. 공급망 공격의 통로가 될 수 있어
# 꼭 필요한 것만 켠다.
# 아래 넷은 Privy 가 끌어온 선택적 네이티브 가속 모듈이라 거부해도
# 자바스크립트 구현으로 동작한다.
allowBuilds:
  '@reown/appkit': false
  bufferutil: false
  keccak: false
  utf-8-validate: false
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@wagmi/connectors@8.0.26'
  - wagmi@3.7.5
# Next.js 가 끌어오는 nanoid 3.3.16 에 무한 루프 취약점(GHSA-2v37-7h3g-55p8)이
# 있어 패치 버전으로 올린다.
# 범위를 ^3.3.17 로 묶는 이유: nanoid 4 부터는 ESM 전용이라 CommonJS 로 불러오는
# postcss 가 깨진다. ">=3.3.17" 로 두면 6.x 가 설치되어 빌드가 실패한다.
overrides:
  nanoid: "^3.3.17"
  # Privy 가 끌어온 axios·ws 의 알려진 취약점을 패치 버전으로 올린다.
  # 둘 다 같은 메이저 안에서의 상향이라 호환성 위험이 없다.
  #
  # uuid 는 일부러 두었다. 패치가 11.x 인데 MetaMask SDK 가 쓰는 8.x/9.x 에서
  # 메이저를 두세 단계 건너뛰어야 하고, 해당 취약점은 v3/v5/v6 에 buf 인자를
  # 줄 때만 발생한다. SDK 는 v4 만 쓰므로 도달하지 않는다.
  axios: "^1.19.0"
  ws: "^8.21.3"
